<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Side Effects Test</title>
    <!-- #include virtual="/imports.html" -->
</head>
<body>
    <form>
        <fieldset disabled>
            <label>
                LHS: <input class="my-class" data-id="{{@. lhs}}">
            </label>
            
            <label for="rhs">
                RHS: <span contenteditable part="my-part" data-id="{{|% rhs}}"></span>
            </label>
            
            <template -id defer-🎚️ 🎚️='on if isEqual, based on #{{lhs}} and #{{rhs}}.'>
                <div>LHS === RHS</div>
            </template>
        </fieldset>
    </form>

    <script type="module">
        import { genIds } from '../genIds.js';
        // Find the trigger element (element with -id attribute)
        const trigger = document.querySelector('[-id]');
        if (trigger) {
            genIds(trigger, document.body);
        }
    </script>
</body>
</html>
